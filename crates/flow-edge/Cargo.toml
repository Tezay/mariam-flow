[package]
name = "flow-edge"
description = "Mariam Flow edge appliance daemon: configuration, installation lifecycle, dashboard and API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "flow-edge"
path = "src/main.rs"

[features]
# Compiles the built dashboard into the binary. Off by default so the crate
# builds and tests on a clean clone with no JavaScript toolchain installed;
# a release build turns it on after `pnpm build`.
dashboard = ["dep:rust-embed"]

[dependencies]
argon2.workspace = true
axum.workspace = true
clap.workspace = true
flow-core.workspace = true
flow-infer.workspace = true
flow-ingest.workspace = true
flate2.workspace = true
jiff.workspace = true
tar.workspace = true
tokio-util.workspace = true
rusqlite.workspace = true
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true
