name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests, cross-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action: installing "stable" would override the pin that
      # rust-toolchain.toml sets and rustup honours.
      - name: Materialise the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Install aarch64 cross C toolchain
        # tract-linalg builds C/assembly sources at compile time, so even
        # `cargo check` for the edge target needs a cross C compiler.
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cross-check (aarch64 Linux edge target)
        run: cargo check --workspace --target aarch64-unknown-linux-gnu
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar

  dashboard:
    name: Dashboard (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: pnpm/action-setup reads it from the
      # `packageManager` field of dashboard/package.json, so CI and a
      # developer's machine cannot drift apart.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The Rust job builds without the dashboard feature, so this is the
      # only place the embedding is exercised against real files.
      - name: Materialise the pinned toolchain
        working-directory: .
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Check the dashboard embeds into the daemon
        working-directory: .
        run: cargo check -p flow-edge --features dashboard

  python:
    name: Python (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ml/uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run pyright

      - name: Tests
        run: uv run pytest

  supply-chain:
    name: Supply chain (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Advisories move without the code changing, so this job can fail on a
      # commit that passed yesterday.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dashboard/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc

      - name: Audit dashboard dependencies
        working-directory: dashboard
        # Moderate and above: low-severity findings here are build-time only,
        # and would train everyone to ignore this job.
        run: pnpm audit --audit-level moderate
