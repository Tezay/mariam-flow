[advisories]
yanked = "deny"

[licenses]
# An allow-list rather than a deny-list: a copyleft dependency would contradict
# the licence this project ships under, and would arrive unannounced.
allow = [
    "PolyForm-Noncommercial-1.0.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# A wildcard on a registry dependency accepts whatever the name resolves to
# tomorrow; on our own path dependencies it means nothing.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
