[workspace]
resolver = "3"
members = [
    "crates/flow-core",
    "crates/flow-ingest",
    "crates/flow-infer",
    "crates/flow-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
flow-core = { path = "crates/flow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
